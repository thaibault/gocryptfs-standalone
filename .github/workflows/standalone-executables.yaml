name: Standalone executables
run-name: Standalone executables

on:
  # NOTE: Runs on branch or tag creation.
  create:
    branches:
      - main
  push:
    branches:
      - main
  # Runs when a new version was prepared.
  repository_dispatch:
    types:
      - prepare-pre-release-event
      - prepare-release-event
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      release:
        description: Attach the executables to the release of this tag.

jobs:
  bundle:
    runs-on: ubuntu-latest
    container: node:lts
    steps:
      - uses: thaibault/install-npm-package-dependencies-action@main

      - name: Build bundle
        run: yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/index.js
          if-no-files-found: error

  executable:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-x64
          - runner: ubuntu-24.04-arm
            name: linux-arm64
          - runner: macos-15-intel
            name: macos-x64
          - runner: macos-latest
            name: macos-arm64
          - runner: windows-latest
            name: windows-x64
          - runner: windows-11-arm
            name: windows-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          # NOTE: Would query the global yarn 1 which refuses this project.
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      # NOTE: Every runner uses its own node binary as executable base.
      - name: Build executable
        run: node standalone.ts build

      - name: Check executable end to end
        run: node standalone.ts test dist/standalone/gocryptfs-standalone-${{ matrix.name }}*

      - name: Package executable
        working-directory: dist/standalone
        run: |
          if [[ '${{ runner.os }}' == Windows ]]; then
            7z a -tzip -mx=9 gocryptfs-standalone-${{ matrix.name }}.zip gocryptfs-standalone-${{ matrix.name }}.exe
          else
            tar --create --gzip --file gocryptfs-standalone-${{ matrix.name }}.tar.gz gocryptfs-standalone-${{ matrix.name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.name }}
          path: |
            dist/standalone/*.tar.gz
            dist/standalone/*.zip
          if-no-files-found: error

  release:
    needs: executable
    if: github.event_name == 'repository_dispatch' || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # NOTE: Dispatched versions already carry the "v" prefix of the tag.
      TAG: ${{ inputs.release || github.event.client_payload.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: executable-*
          merge-multiple: true
          path: executables

      - name: Create checksums
        working-directory: executables
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ github.event.action == 'prepare-pre-release-event' }}
          files: executables/*
